url: ~
template:
  bootstrap: 5

reference:
  - title: Model setup
    desc: >
      Functions for combining a standard mizer `MizerParams` object with
      therMizer's temperature forcing and realm structure. The result is a
      `therMizer` object, whose temperature-scaled encounter, predation and
      metabolism rates mizer dispatches to automatically during `project()`.
    contents:
      - upgradeTherParams
      - setVerticality

  - title: Scaling parameters
    desc: >
      Functions that compute the species-specific constants used to normalise
      the encounter/predation and metabolism temperature responses to the
      \[0, 1\] interval. These are called automatically by `upgradeTherParams()`
      but are also exported for direct use.
    contents:
      - setEncounterPredScale
      - setMetabTher

  - title: Resource forcing
    desc: >
      The resource dynamics function that reads the time-varying plankton
      spectrum stored in the model. `upgradeTherParams()` installs it
      automatically when it is given an `n_pp_array`.
    contents:
      - plankton_forcing

  - title: Diagnostics
    desc: >
      Functions for inspecting the temperature scalars that therMizer applies
      at each time step.
    contents:
      - scaled_temp_effect

  - title: Visualisation
    desc: >
      Plotting functions for exploring species' thermal performance curves and
      the time-varying temperature scalars they experience.
    contents:
      - plotTherPerformance
      - plotTherScalar

  - title: Package
    contents:
      - therMizer-package
